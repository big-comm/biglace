<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded square (Adwaita style) -->
  <rect x="6" y="6" width="116" height="116" rx="24" ry="24" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="24" ry="24" fill="url(#topGlow)"/>

  <!-- mesh: hexagonal pattern around a highlighted center node -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <!-- spokes: center → 6 outer nodes -->
    <line x1="64" y1="64" x2="92" y2="64" stroke-width="3"/>
    <line x1="64" y1="64" x2="36" y2="64" stroke-width="3"/>
    <line x1="64" y1="64" x2="78" y2="40" stroke-width="3"/>
    <line x1="64" y1="64" x2="50" y2="40" stroke-width="3"/>
    <line x1="64" y1="64" x2="78" y2="88" stroke-width="3"/>
    <line x1="64" y1="64" x2="50" y2="88" stroke-width="3"/>

    <!-- perimeter (the "lace") -->
    <g stroke-width="2" opacity="0.65">
      <line x1="92" y1="64" x2="78" y2="40"/>
      <line x1="78" y1="40" x2="50" y2="40"/>
      <line x1="50" y1="40" x2="36" y2="64"/>
      <line x1="36" y1="64" x2="50" y2="88"/>
      <line x1="50" y1="88" x2="78" y2="88"/>
      <line x1="78" y1="88" x2="92" y2="64"/>
    </g>
  </g>

  <!-- outer nodes -->
  <g fill="#ffffff">
    <circle cx="92" cy="64" r="6"/>
    <circle cx="36" cy="64" r="6"/>
    <circle cx="78" cy="40" r="6"/>
    <circle cx="50" cy="40" r="6"/>
    <circle cx="78" cy="88" r="6"/>
    <circle cx="50" cy="88" r="6"/>
  </g>

  <!-- center node: halo + ring + dot in brand blue -->
  <circle cx="64" cy="64" r="16" fill="url(#centerHalo)"/>
  <circle cx="64" cy="64" r="9"  fill="#ffffff"/>
  <circle cx="64" cy="64" r="4"  fill="#1a5fb4"/>
</svg>
