<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <g fill="#2e3436">
    <!-- spokes -->
    <g stroke="#2e3436" stroke-width="1.1" stroke-linecap="round" fill="none">
      <line x1="8" y1="8" x2="14" y2="8"/>
      <line x1="8" y1="8" x2="2"  y2="8"/>
      <line x1="8" y1="8" x2="11.5" y2="2.8"/>
      <line x1="8" y1="8" x2="4.5"  y2="2.8"/>
      <line x1="8" y1="8" x2="11.5" y2="13.2"/>
      <line x1="8" y1="8" x2="4.5"  y2="13.2"/>
    </g>
    <!-- perimeter -->
    <g stroke="#2e3436" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.7">
      <line x1="14"   y1="8"    x2="11.5" y2="2.8"/>
      <line x1="11.5" y1="2.8"  x2="4.5"  y2="2.8"/>
      <line x1="4.5"  y1="2.8"  x2="2"    y2="8"/>
      <line x1="2"    y1="8"    x2="4.5"  y2="13.2"/>
      <line x1="4.5"  y1="13.2" x2="11.5" y2="13.2"/>
      <line x1="11.5" y1="13.2" x2="14"   y2="8"/>
    </g>
    <!-- nodes -->
    <circle cx="14"   cy="8"    r="1.5"/>
    <circle cx="2"    cy="8"    r="1.5"/>
    <circle cx="11.5" cy="2.8"  r="1.5"/>
    <circle cx="4.5"  cy="2.8"  r="1.5"/>
    <circle cx="11.5" cy="13.2" r="1.5"/>
    <circle cx="4.5"  cy="13.2" r="1.5"/>
    <!-- center -->
    <circle cx="8" cy="8" r="2.6"/>
  </g>
</svg>
