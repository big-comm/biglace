<?xml version="1.0" encoding="UTF-8"?>
<!--
  Symbolic tray icon: a hexagonal mesh (matches the full-color app icon).

  Every part is a FILLED shape (circle/rect), never a stroke, so the host's
  symbolic recoloring recolors the whole icon uniformly. Recoloring only ever
  overrides `fill`: GTK hosts inject `circle,rect,path { fill: <fg> !important }`
  and never touch `stroke` (nor select `<line>`). An earlier version drew the
  spokes and perimeter with `stroke`, so on a dark panel only the filled nodes
  turned light while the dark strokes stayed invisible — the icon read as a
  "sun" (6 dots around a blob). Drawing the connections as thin filled rects
  fixes that on light and dark panels alike.

  Dual convention for broad host support:
    - GTK hosts override `fill` via the !important rule above.
    - KDE/Plasma hosts rewrite `.ColorScheme-Text { color: <fg> }`, picked up
      here through `fill="currentColor"`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#2e3436; }</style>
  </defs>
  <g class="ColorScheme-Text" fill="currentColor">
    <!-- spokes: center -> each of the 6 outer nodes -->
    <g>
      <rect x="8" y="7.45" width="5.2" height="1.1" rx="0.55"/>
      <rect x="8" y="7.45" width="5.2" height="1.1" rx="0.55" transform="rotate(60 8 8)"/>
      <rect x="8" y="7.45" width="5.2" height="1.1" rx="0.55" transform="rotate(120 8 8)"/>
      <rect x="8" y="7.45" width="5.2" height="1.1" rx="0.55" transform="rotate(180 8 8)"/>
      <rect x="8" y="7.45" width="5.2" height="1.1" rx="0.55" transform="rotate(240 8 8)"/>
      <rect x="8" y="7.45" width="5.2" height="1.1" rx="0.55" transform="rotate(300 8 8)"/>
    </g>
    <!-- perimeter: edges between adjacent nodes (the "lace") -->
    <g opacity="0.6">
      <rect x="13.2" y="7.55" width="5.2" height="0.9" rx="0.45" transform="rotate(120 13.2 8)"/>
      <rect x="13.2" y="7.55" width="5.2" height="0.9" rx="0.45" transform="rotate(60 8 8) rotate(120 13.2 8)"/>
      <rect x="13.2" y="7.55" width="5.2" height="0.9" rx="0.45" transform="rotate(120 8 8) rotate(120 13.2 8)"/>
      <rect x="13.2" y="7.55" width="5.2" height="0.9" rx="0.45" transform="rotate(180 8 8) rotate(120 13.2 8)"/>
      <rect x="13.2" y="7.55" width="5.2" height="0.9" rx="0.45" transform="rotate(240 8 8) rotate(120 13.2 8)"/>
      <rect x="13.2" y="7.55" width="5.2" height="0.9" rx="0.45" transform="rotate(300 8 8) rotate(120 13.2 8)"/>
    </g>
    <!-- outer nodes -->
    <g>
      <circle cx="13.2" cy="8" r="1.5"/>
      <circle cx="13.2" cy="8" r="1.5" transform="rotate(60 8 8)"/>
      <circle cx="13.2" cy="8" r="1.5" transform="rotate(120 8 8)"/>
      <circle cx="13.2" cy="8" r="1.5" transform="rotate(180 8 8)"/>
      <circle cx="13.2" cy="8" r="1.5" transform="rotate(240 8 8)"/>
      <circle cx="13.2" cy="8" r="1.5" transform="rotate(300 8 8)"/>
    </g>
    <!-- center node -->
    <circle cx="8" cy="8" r="2.4"/>
  </g>
</svg>
