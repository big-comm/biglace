<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <g fill="#2e3436">
    <!-- spokes -->
    <g stroke="#2e3436" stroke-width="0.9" stroke-linecap="round" fill="none">
      <line x1="8" y1="8" x2="13" y2="8"/>
      <line x1="8" y1="8" x2="3"  y2="8"/>
      <line x1="8" y1="8" x2="11" y2="4"/>
      <line x1="8" y1="8" x2="5"  y2="4"/>
      <line x1="8" y1="8" x2="11" y2="12"/>
      <line x1="8" y1="8" x2="5"  y2="12"/>
    </g>
    <!-- perimeter -->
    <g stroke="#2e3436" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.7">
      <line x1="13" y1="8"  x2="11" y2="4"/>
      <line x1="11" y1="4"  x2="5"  y2="4"/>
      <line x1="5"  y1="4"  x2="3"  y2="8"/>
      <line x1="3"  y1="8"  x2="5"  y2="12"/>
      <line x1="5"  y1="12" x2="11" y2="12"/>
      <line x1="11" y1="12" x2="13" y2="8"/>
    </g>
    <!-- nodes -->
    <circle cx="13" cy="8"  r="1.2"/>
    <circle cx="3"  cy="8"  r="1.2"/>
    <circle cx="11" cy="4"  r="1.2"/>
    <circle cx="5"  cy="4"  r="1.2"/>
    <circle cx="11" cy="12" r="1.2"/>
    <circle cx="5"  cy="12" r="1.2"/>
    <!-- center -->
    <circle cx="8" cy="8" r="2.1"/>
  </g>
</svg>
