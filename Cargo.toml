[package]
name = "biglace"
version = "0.1.0"
edition = "2021"
authors = ["BigCommunity"]
description = "Mesh VPN client with a graphical interface for Headscale/Tailscale"
license = "MIT"

[dependencies]
gtk4        = { version = "0.11", features = ["v4_12"] }
libadwaita  = { version = "0.9",  features = ["v1_4"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
anyhow      = "1"
gettext-rs  = { version = "0.7", features = ["gettext-system"] }
ureq        = { version = "2",   features = ["json", "tls"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
