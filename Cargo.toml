[package]
name = "biglace"
version = "1.69.0"
edition = "2021"
authors = ["BigCommunity"]
description = "Mesh VPN client with a graphical interface for Headscale/Tailscale"
license = "MIT"

[features]
# jemalloc on by default for local cargo builds — gives the long-idle RSS win
# described in main.rs. Distro packagers (PKGBUILD, .deb, etc.) should build
# with `--no-default-features` because some hardened linker setups (Arch's
# LLD + `-Wl,--gc-sections -nodefaultlibs -pie`) fail to resolve the prefixed
# `_rjem_*` symbols from tikv-jemalloc-sys's static archive.
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
gtk4        = { version = "0.11", features = ["v4_12"] }
libadwaita  = { version = "0.9",  features = ["v1_4"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
anyhow      = "1"
gettext-rs  = { version = "0.8", features = ["gettext-system"] }
ureq        = { version = "2",   default-features = false, features = ["json", "native-tls"] }
native-tls  = "0.2"
# Wakes the GTK main loop only when a worker actually has a result, instead
# of polling shared slots on a timer.
async-channel = "2"
# Device names: "José" → "jose" rather than dropping the accented letter.
unicode-normalization = "0.1"
qrcodegen = "1.8"
# Device key: each installation signs its requests to the panel (Ed25519),
# so a VM or container behind this machine can't speak for it.
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# Socket options for the remote-desktop stream (send buffer size).
socket2 = { version = "0.6", features = ["all"] }
pulldown-cmark = { version = "0.13", default-features = false }
# The clipboard on Wayland without a focused window (ext-data-control):
# KWin and wlroots give it only to clients that speak the protocol.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# jemalloc: long-running desktop processes on glibc accumulate fragmentation
# and glibc's malloc doesn't return free pages to the kernel. jemalloc has a
# background thread that decays unused pages back via madvise — this is the
# single biggest RSS win for an app that stays open for hours.
# Linux/macOS only; jemalloc has no Windows support in tikv-jemallocator.
# Optional + cfg-gated below so a `--no-default-features` build is the
# escape hatch for packagers whose linker can't resolve `_rjem_*` symbols.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tikv-jemallocator = { version = "0.6", default-features = false, features = ["background_threads"], optional = true }

# Native OS credential storage. Per-target features avoid pulling in the
# wrong backend on cross-compiles (e.g. don't drag D-Bus into a Windows build).
[target.'cfg(target_os = "linux")'.dependencies]
# Local network without a server (crate::lan): a certificate made at each
# start for TLS. Already in the build through native-tls.
openssl = "0.10"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# StatusNotifierItem (KDE/freedesktop tray spec, also honored by GNOME via the
# AppIndicator extension). `async-io` picks the lighter zbus backend; `blocking`
# wraps it in a sync API so we don't need a tokio runtime in main().
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# Remote desktop (BigLace↔BigLace): capture/encode/decode with GStreamer,
# input injection on X11 hosts via XTest.
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
x11rb = { version = "0.14", features = ["xtest", "damage", "xfixes"] }
# Wayland hosts: screen and input through the desktop's remote-desktop portal.
ashpd = { version = "0.14", default-features = false, features = ["async-io", "remote_desktop", "screencast", "global_shortcuts"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
# Portal input through libei (ConnectToEIS); the EIS server's keymap turns
# the viewer's keysyms into the keycodes libei sends.
reis = { version = "0.7", features = ["async-io"] }
xkbcommon = { version = "0.9", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-io = "2"
rustix = { version = "1", default-features = false, features = ["time"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Tray icon (Shell_NotifyIcon under the hood). Needs a Win32 message pump,
# which we run on a dedicated worker thread inside src/tray/windows.rs.
tray-icon = { version = "0.24", default-features = false }
# Just the message-pump bits; pulling the rest of windows-sys would balloon
# compile time for no reason.
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
# Action Center toasts (peer online/offline notifications). Falls back to
# the PowerShell AUMID until biglace.exe registers its own — otherwise
# Windows refuses to surface toasts from an unregistered app id.
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
# Drop unwinding tables and landing pads — biglace is a desktop app, a panic
# means a bug we want to crash loudly on, not gracefully unwind. Saves
# binary size and a slice of resident RAM that's never useful at runtime.
panic         = "abort"
