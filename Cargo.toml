[package]
name = "biglace"
version = "1.0.0"
edition = "2021"
authors = ["BigCommunity"]
description = "Mesh VPN client with a graphical interface for Headscale/Tailscale"
license = "MIT"

[dependencies]
gtk4        = { version = "0.11", features = ["v4_12"] }
libadwaita  = { version = "0.9",  features = ["v1_4"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
anyhow      = "1"
gettext-rs  = { version = "0.7", features = ["gettext-system"] }
ureq        = { version = "2",   default-features = false, features = ["json", "native-tls"] }
native-tls  = "0.2"

# Native OS credential storage. Per-target features avoid pulling in the
# wrong backend on cross-compiles (e.g. don't drag D-Bus into a Windows build).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# StatusNotifierItem (KDE/freedesktop tray spec, also honored by GNOME via the
# AppIndicator extension). `async-io` picks the lighter zbus backend; `blocking`
# wraps it in a sync API so we don't need a tokio runtime in main().
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
# Drop unwinding tables and landing pads — biglace is a desktop app, a panic
# means a bug we want to crash loudly on, not gracefully unwind. Saves
# binary size and a slice of resident RAM that's never useful at runtime.
panic         = "abort"
