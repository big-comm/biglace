[package]
name = "biglace"
version = "1.0.0"
edition = "2021"
authors = ["BigCommunity"]
description = "Mesh VPN client with a graphical interface for Headscale/Tailscale"
license = "MIT"

# cargo-wix metadata. Drives the Windows MSI build in
# .github/workflows/windows.yml. The .wxs lives at wix/main.wxs.
[package.metadata.wix]
include = ["wix/main.wxs"]
# Also generate a per-build runtime fragment via heat.exe (the workflow does
# this as a separate step before invoking cargo-wix). The fragment is included
# at link time via -ext WixUtilExtension and the RuntimeFiles ComponentGroup
# referenced in main.wxs.

[features]
# jemalloc on by default for local cargo builds — gives the long-idle RSS win
# described in main.rs. Distro packagers (PKGBUILD, .deb, etc.) should build
# with `--no-default-features` because some hardened linker setups (Arch's
# LLD + `-Wl,--gc-sections -nodefaultlibs -pie`) fail to resolve the prefixed
# `_rjem_*` symbols from tikv-jemalloc-sys's static archive.
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
gtk4        = { version = "0.11", features = ["v4_12"] }
libadwaita  = { version = "0.9",  features = ["v1_4"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
anyhow      = "1"
gettext-rs  = { version = "0.7", features = ["gettext-system"] }
ureq        = { version = "2",   default-features = false, features = ["json", "native-tls"] }
native-tls  = "0.2"

# jemalloc: long-running desktop processes on glibc accumulate fragmentation
# and glibc's malloc doesn't return free pages to the kernel. jemalloc has a
# background thread that decays unused pages back via madvise — this is the
# single biggest RSS win for an app that stays open for hours.
# Linux/macOS only; jemalloc has no Windows support in tikv-jemallocator.
# Optional + cfg-gated below so a `--no-default-features` build is the
# escape hatch for packagers whose linker can't resolve `_rjem_*` symbols.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tikv-jemallocator = { version = "0.6", default-features = false, features = ["background_threads"], optional = true }

# Native OS credential storage. Per-target features avoid pulling in the
# wrong backend on cross-compiles (e.g. don't drag D-Bus into a Windows build).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# StatusNotifierItem (KDE/freedesktop tray spec, also honored by GNOME via the
# AppIndicator extension). `async-io` picks the lighter zbus backend; `blocking`
# wraps it in a sync API so we don't need a tokio runtime in main().
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Tray icon (Shell_NotifyIcon under the hood). Needs a Win32 message pump,
# which we run on a dedicated worker thread inside src/tray/windows.rs.
tray-icon = { version = "0.24", default-features = false }
# Just the message-pump bits; pulling the rest of windows-sys would balloon
# compile time for no reason.
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
# Action Center toasts (peer online/offline notifications). Falls back to
# the PowerShell AUMID until biglace.exe registers its own — otherwise
# Windows refuses to surface toasts from an unregistered app id.
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
# Drop unwinding tables and landing pads — biglace is a desktop app, a panic
# means a bug we want to crash loudly on, not gracefully unwind. Saves
# binary size and a slice of resident RAM that's never useful at runtime.
panic         = "abort"
